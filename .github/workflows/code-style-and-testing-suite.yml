name: Code Style and Testing Suite
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🟢 Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🗂️ Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 🐈 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 📝 Run Stylelint
        run: yarn stylelint:check

      - name: 🧹 Run ESLint
        run: yarn eslint:check

      - name: 🎨 Run Prettier
        run: yarn prettier:check

      - name: 🔎 Run Jest specs
        run: yarn test

      - name: 🧶 Build React component documentation and compile TypeScript
        run: yarn build

      - name: 📄 Check React component documentation and TypeScript compilation
        run: |
          git diff --exit-code || \
          { \
            echo "Changes are detected in React component documentation and/or TypeScript compilation."; \
            echo "Please run \"yarn build\" and commit the changes."; \
            exit 1; \
          }
